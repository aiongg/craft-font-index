[package]
name = "craft-font-index"
version = "1.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Generators for the font indexes used by the Craft apps"
repository = "https://github.com/aiongg/craft-font-index"
publish = false

[dependencies]
flate2 = "1.1"
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
skrifa = "0.48"

[profile.release]
debug = false
